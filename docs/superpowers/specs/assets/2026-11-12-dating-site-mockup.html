<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@chinese-fonts/lxgwwenkai@3.0.0/dist/LXGWWenKai-Medium/result.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --ink:#1D1D1F; --ink-2:#6E6E73; --line:#E3E3E8; --paper:#FFFFFF; --mist:#F5F5F7;
  --blue:#1F6FEB; --blue-ink:#0B4FC4; --sun:#FFC93C; --go:#1E8E4E;
  --sans:"Geist",-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Instrument Serif","Noto Serif SC","Songti SC",serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="zh"] body{letter-spacing:.01em}
em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0}
/* Chinese: one typeface, emphasis by tone (Apple two-tone headline), not by switching fonts */
html[lang="zh"] em{font-family:inherit;font-style:normal;font-weight:inherit;color:var(--ink-2)}
html[lang="zh"] .mark em{color:inherit}
html[lang="zh"] p,html[lang="zh"] dd small{line-height:1.7}
html[lang="zh"] .tile p{font-size:13.5px}
html[lang="zh"] .feature-tile .quote{font-family:"Noto Serif SC","Songti SC",serif;font-weight:500;font-size:22px}
html[lang="zh"] .tagline{letter-spacing:.02em}
a{color:inherit;text-decoration:none}
.container{max-width:1120px;margin:0 auto;padding:0 20px}
@media(min-width:834px){.container{padding:0 40px}}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.06)}
.nav .container{height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em}
.links{display:none;gap:28px;font-size:13px;color:var(--ink-2)}
.links a{transition:color .2s}.links a:hover{color:var(--ink)}
@media(min-width:834px){.links{display:flex}}
.nav-r{display:flex;align-items:center;gap:12px}
.lang{display:flex;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px}
.lang button{all:unset;cursor:pointer;padding:4px 10px;border-radius:999px;color:var(--ink-2);transition:all .3s var(--spring)}
.lang button.on{background:var(--ink);color:#fff}
.cart{all:unset;cursor:pointer;position:relative;width:34px;height:34px;display:grid;place-items:center;font-size:14px;border-radius:50%;transition:background .2s}
.cart:hover{background:var(--mist)}
.cart .badge{position:absolute;top:2px;right:0;min-width:16px;height:16px;border-radius:8px;background:var(--sun);color:var(--ink);font-size:10px;font-weight:700;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--spring)}
.cart.has .badge{transform:scale(1)}
.cart.bump{animation:jelly .55s}

/* ---------- shared ---------- */
section{padding:88px 0}
@media(min-width:834px){section{padding:128px 0}}
.eyebrow{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:12px;letter-spacing:.01em}
h2{font-size:40px;line-height:1.05;letter-spacing:-.035em;font-weight:600;margin:0}
@media(min-width:834px){h2{font-size:64px}}
html[lang="zh"] h2{letter-spacing:-.01em;line-height:1.15}
.lede{font-size:17px;line-height:1.5;color:var(--ink-2);margin:16px 0 0;max-width:520px}
@media(min-width:834px){.lede{font-size:21px}}

.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-size:15px;font-weight:500;transition:transform .2s,background .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:var(--blue-ink)}
.btn-ghost{color:var(--blue);padding:13px 6px}
.btn-ghost:hover{text-decoration:underline;text-underline-offset:4px}
.btn:active{animation:jelly .5s}
@keyframes jelly{30%{transform:scale(1.12,.88)}50%{transform:scale(.94,1.06)}70%{transform:scale(1.03,.97)}100%{transform:none}}

.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--go)}
.pulse{width:8px;height:8px;border-radius:50%;background:#26B35F;position:relative}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;background:#26B35F;animation:ping 1.8s ease-out infinite}
@keyframes ping{to{transform:scale(3);opacity:0}}

.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#8A8A90;font-size:12px;font-weight:500;user-select:none}
.ph i{font-size:20px;opacity:.7}

/* reveal */
.reveal{opacity:0;transform:translateY(28px) scale(.98);transition:opacity .7s var(--ease),transform .9s var(--spring)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}*{animation:none!important}}

/* ---------- hero ---------- */
.hero{padding:56px 0 88px;background:linear-gradient(180deg,#EEF4FC 0%,#FFFFFF 70%);overflow:hidden}
.hero-grid{display:grid;gap:48px;align-items:center;text-align:center}
@media(min-width:834px){.hero{padding:96px 0 128px}.hero-grid{grid-template-columns:1.1fr .9fr;text-align:left;gap:40px}}
.new{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.02em}
.new::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 3px rgba(255,201,60,.25)}
.name{font-size:76px;line-height:.95;letter-spacing:-.05em;font-weight:600;margin:18px 0 0}
@media(min-width:834px){.name{font-size:132px}}
html[lang="zh"] .name{letter-spacing:.02em;font-weight:600}
.tagline{font-size:24px;line-height:1.25;letter-spacing:-.02em;font-weight:500;margin:18px 0 0}
@media(min-width:834px){.tagline{font-size:34px}}
.mark{background:linear-gradient(transparent 62%,rgba(255,201,60,.55) 62%,rgba(255,201,60,.55) 90%,transparent 90%);padding:0 .08em}
.hero .status{margin-top:26px}
.hero .btns{margin-top:22px;justify-content:center}
@media(min-width:834px){.hero .btns{justify-content:flex-start}}

.deck-wrap{display:flex;flex-direction:column;align-items:center}
.deck{position:relative;width:min(72vw,300px);aspect-ratio:4/5;cursor:pointer;-webkit-tap-highlight-color:transparent}
@media(min-width:834px){.deck{width:360px}}
.dcard{position:absolute;inset:0;border-radius:28px;background:#E8E8ED;border:6px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 18px 40px -12px rgba(29,29,31,.22);transition:transform .7s var(--spring),opacity .4s}
.dcard .ph{height:100%}
.hint{margin-top:22px;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}

/* ---------- core ---------- */
.core-head{max-width:720px}
.core-list{list-style:none;margin:56px 0 0;padding:0;display:grid;border-top:1px solid var(--line)}
@media(min-width:834px){.core-list{grid-template-columns:1fr 1fr;column-gap:64px;border-top:0}}
.core-item{display:grid;grid-template-columns:56px 1fr;gap:4px 12px;padding:28px 0;border-bottom:1px solid var(--line)}
@media(min-width:834px){.core-item{padding:40px 0;border-top:1px solid var(--line);border-bottom:0}}
.core-num{font-family:var(--serif);font-size:34px;line-height:1;color:var(--ink-2)}
.core-item h3{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.25;display:flex;align-items:center;gap:10px}
@media(min-width:834px){.core-item h3{font-size:26px}}
.core-item h3 i{font-size:15px;color:var(--blue)}
.core-item p{grid-column:2;margin:6px 0 0;font-size:16px;line-height:1.5;color:var(--ink-2)}

/* ---------- bonus ---------- */
.bonus{background:var(--mist)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px}
@media(min-width:834px){.tiles{grid-template-columns:repeat(4,1fr);gap:16px}}
.tile{background:#fff;border-radius:22px;padding:22px 18px 20px;transition:transform .4s var(--spring)}
.tile:hover{transform:translateY(-4px)}
.tile:active{transform:scale(.97)}
.tile .ic{width:48px;height:48px;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 4px 10px -4px rgba(0,0,0,.15);transition:transform .5s var(--spring)}
.tile:hover .ic{transform:rotate(-6deg) scale(1.06)}
.tile .ic svg{display:block;width:100%;height:100%}
.tile h3{margin:18px 0 0;font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.tile p{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.4}
.feature-tile{grid-column:1/-1;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:18px;padding:28px 24px}
@media(min-width:834px){.feature-tile{flex-direction:row;align-items:center;justify-content:space-between;padding:36px 40px}}
.feature-tile .ft-l{display:flex;gap:18px;align-items:center}
.feature-tile .ic{width:56px;height:56px;flex:0 0 56px;box-shadow:none}
.feature-tile h3{margin:0;font-size:22px}
@media(min-width:834px){.feature-tile h3{font-size:28px}}
.feature-tile p{color:rgba(255,255,255,.6);font-size:15px}
.feature-tile .quote{font-family:var(--serif);font-style:italic;font-size:24px;color:rgba(255,255,255,.9);line-height:1.2}
html[lang="zh"] .feature-tile .quote{font-style:normal}

/* ---------- features ---------- */
.feat-grid{display:grid;gap:48px;margin-top:56px}
@media(min-width:834px){.feat-grid{grid-template-columns:1fr 1fr;gap:64px 40px}}
.show{position:relative}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:24px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:4/3;background:#EDEDF0;position:relative;cursor:pointer;overflow:hidden}
.slide:nth-child(even){background:#E6E9EE}
.slide .ph{height:100%}
.arrow{all:unset;position:absolute;top:50%;width:36px;height:36px;margin-top:-18px;border-radius:50%;background:rgba(255,255,255,.9);display:none;place-items:center;font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .2s,transform .3s var(--spring)}
.arrow:hover{transform:scale(1.1)}
.arrow.prev{left:12px}.arrow.next{right:12px}
@media(hover:hover){.arrow{display:grid}.show:hover .arrow{opacity:1}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}
.dots button{all:unset;cursor:pointer;width:6px;height:6px;border-radius:3px;background:#C7C7CC;transition:all .45s var(--spring)}
.dots button.on{width:20px;background:var(--ink)}
.feat h3{margin:20px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.feat h3 i{font-size:16px;color:var(--ink-2)}
.feat p{margin:6px 0 0;font-size:16px;line-height:1.5;color:var(--ink-2);max-width:440px}

/* ---------- specs ---------- */
.specs{background:var(--mist)}
.specs-grid{display:grid;gap:40px}
@media(min-width:834px){.specs-grid{grid-template-columns:1fr 2fr;gap:64px}}
.spec-rows{border-top:1px solid #D2D2D7}
.spec{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid #D2D2D7}
@media(min-width:834px){.spec{grid-template-columns:200px 1fr;padding:24px 0}}
.spec dt{font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline}
.spec dt i{width:14px;text-align:center;font-size:13px}
.spec dd{margin:0;font-size:17px;font-weight:500;letter-spacing:-.01em}
@media(min-width:834px){.spec dd{font-size:20px}}
.spec dd small{display:block;font-size:14px;font-weight:400;color:var(--ink-2);margin-top:4px}

/* ---------- cta ---------- */
.cta{text-align:center}
.cta h2{font-size:52px}
@media(min-width:834px){.cta h2{font-size:96px}}
.cta .status{margin-top:28px}
.cta .btns{justify-content:center;margin-top:24px}
.ship{margin-top:20px;font-size:13px;color:var(--ink-2)}

footer{border-top:1px solid var(--line);padding:28px 0 40px;font-size:12px;color:var(--ink-2)}
footer .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* toast + hearts */
.toast{position:fixed;left:50%;bottom:24px;z-index:60;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;display:flex;gap:10px;align-items:center;transition:all .45s var(--spring);pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.heart{position:absolute;font-size:20px;pointer-events:none;animation:float 1.3s ease-out forwards;z-index:5}
@keyframes float{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),-150px) scale(1.25)}}

/* ===== v8 type system: Fraunces (EN display) + LXGW WenKai (ZH display) ===== */
:root{--display:"Fraunces","LXGW WenKai Medium","Noto Serif SC",serif}
.name,.tagline,h2,.core-num,.feature-tile .quote{font-family:var(--display);font-variation-settings:"opsz" 144}
.name{font-weight:600;letter-spacing:-.045em}
.tagline{font-weight:400;font-style:italic;letter-spacing:-.015em}
h2{font-weight:500;letter-spacing:-.03em}
.core-num{font-style:italic;font-weight:300}
em{font-family:inherit;font-style:inherit;font-weight:inherit;color:var(--ink-2)}
.mark em{color:inherit}
.feature-tile .quote{font-style:italic;font-weight:400}
html[lang="zh"] .name,html[lang="zh"] .tagline,html[lang="zh"] h2,html[lang="zh"] .feature-tile .quote,
html[lang="zh"] .core-item h3,html[lang="zh"] .core-item p,html[lang="zh"] .feat h3,html[lang="zh"] .feat p,
html[lang="zh"] .feature-tile h3,html[lang="zh"] .lede{font-family:"LXGW WenKai Medium","Noto Sans SC",serif;font-style:normal;font-weight:400}
h2,.tagline{text-wrap:balance}
html[lang="zh"] h2 em,html[lang="zh"] .tagline .mark{white-space:nowrap}
html[lang="zh"] .name{letter-spacing:.02em}
html[lang="zh"] .tagline{letter-spacing:.03em}
html[lang="zh"] h2{letter-spacing:.01em;line-height:1.2}
html[lang="zh"] .core-item h3{font-size:22px}
@media(min-width:834px){html[lang="zh"] .core-item h3{font-size:27px}}
html[lang="zh"] .core-item p,html[lang="zh"] .feat p{font-size:16.5px}

.with-ic{display:flex;align-items:center;gap:16px}
.hui{width:84px;height:61px;flex:0 0 auto;transition:transform .5s var(--spring)}
.with-ic:hover .hui{transform:rotate(-4deg) scale(1.06)}
.hui.sm{width:46px;height:34px}
.foot-l{display:inline-flex;align-items:center;gap:10px}
</style>
</head>
<body>

<header class="nav">
  <div class="container">
    <a class="brand" href="#top" data-i="brand"></a>
    <nav class="links">
      <a href="#box" data-i="navBox"></a><a href="#features" data-i="navFeat"></a><a href="#specs" data-i="navSpecs"></a>
    </nav>
    <div class="nav-r">
      <div class="lang"><button data-l="en">EN</button><button data-l="zh">中文</button></div>
      <button class="cart" id="cart" aria-label="Cart"><i class="fa-solid fa-bag-shopping"></i><span class="badge">1</span></button>
    </div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="container hero-grid">
      <div class="reveal">
        <div class="new" data-i="new"></div>
        <h1 class="name" data-i="name"></h1>
        <p class="tagline" data-h="tagline"></p>
        <div class="status"><span class="pulse"></span><span data-i="status"></span></div>
        <div class="btns">
          <button class="btn btn-primary" data-act="cart"><i class="fa-solid fa-bag-shopping"></i><span data-i="cartBtn"></span></button>
          <button class="btn btn-ghost" data-act="mail"><span data-i="contact"></span> <i class="fa-solid fa-chevron-right" style="font-size:11px"></i></button>
        </div>
      </div>
      <div class="deck-wrap reveal">
        <div class="deck" id="deck" role="button" aria-label="Next photo"></div>
        <div class="hint"><i class="fa-regular fa-hand-pointer"></i><span data-i="tap"></span></div>
      </div>
    </div>
  </section>

  <!-- WHAT'S IN THE BOX -->
  <section id="box">
    <div class="container">
      <div class="core-head reveal">
        <div class="eyebrow" data-i="coreEyebrow"></div>
        <h2 data-h="coreTitle"></h2>
      </div>
      <ul class="core-list">
        <li class="core-item reveal"><span class="core-num">01</span><h3><span data-i="c1"></span></h3><p data-i="c1s"></p></li>
        <li class="core-item reveal"><span class="core-num">02</span><h3><span data-i="c2"></span></h3><p data-i="c2s"></p></li>
        <li class="core-item reveal"><span class="core-num">03</span><h3><span data-i="c3"></span></h3><p data-i="c3s"></p></li>
        <li class="core-item reveal"><span class="core-num">04</span><h3><span data-i="c4"></span></h3><p data-i="c4s"></p></li>
      </ul>
    </div>
  </section>

  <!-- BONUS -->
  <section class="bonus">
    <div class="container">
      <div class="reveal">
        <div class="eyebrow" data-i="boxEyebrow"></div>
        <h2 data-h="boxTitle"></h2>
        <p class="lede" data-i="boxSub"></p>
      </div>
      <div class="tiles">
        <div class="tile reveal"><div class="ic"><svg viewBox="0 0 64 64"><defs><linearGradient id="icl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF1F8"/></linearGradient><linearGradient id="icc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AC8FA"/><stop offset="1" stop-color="#1A7CF5"/></linearGradient></defs><rect width="64" height="64" fill="url(#icl)"/><path d="M19 43h27a9 9 0 0 0 1-17.9A12 12 0 0 0 24.4 22 9.5 9.5 0 0 0 19 43z" fill="url(#icc)"/></svg></div><h3 data-i="p1"></h3><p data-i="p1s"></p></div>
        <div class="tile reveal"><div class="ic"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#fff"/><rect x="9" y="17" width="46" height="30" rx="9" fill="#FF0033"/><path d="M28 25.5v13l11.5-6.5z" fill="#fff"/></svg></div><h3 data-i="p2"></h3><p data-i="p2s"></p></div>
        <div class="tile reveal"><div class="ic"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#fff"/><text x="32" y="33" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-style="italic" font-size="12.5" fill="#E31837" letter-spacing="-.3">COSTCO</text><rect x="9" y="37" width="46" height="4" rx="1" fill="#005DAA"/><text x="32" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="5.5" fill="#005DAA" letter-spacing="1.2">WHOLESALE</text></svg></div><h3 data-i="p3"></h3><p data-i="p3s"></p></div>
        <div class="tile reveal"><div class="ic"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#1D1D1F"/><path d="M17 36v-5a15 15 0 0 1 30 0v5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><rect x="13" y="33" width="9" height="13" rx="4" fill="#fff"/><rect x="42" y="33" width="9" height="13" rx="4" fill="#fff"/><path d="M46 46c0 5-5 7-11 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="33" cy="53" r="3" fill="#FFC93C"/></svg></div><h3 data-i="p4"></h3><p data-i="p4s"></p></div>
        <div class="tile feature-tile reveal">
          <div class="ft-l">
            <div class="ic"><svg viewBox="0 0 64 64"><rect width="64" height="64" fill="#FFC93C"/><path d="M24 20l3-5h10l3 5h8a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H16a5 5 0 0 1-5-5V25a5 5 0 0 1 5-5z" fill="#1D1D1F"/><circle cx="32" cy="34" r="10" fill="#1D1D1F" stroke="#fff" stroke-width="3"/><circle cx="29" cy="31" r="2.5" fill="#fff" opacity=".85"/></svg></div>
            <div><h3 data-i="p5"></h3><p data-i="p5s"></p></div>
          </div>
          <div class="quote" data-i="p5q"></div>
        </div>
      </div>
    </div>

let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
let lang=saved||((navigator.language||'en').toLowerCase().startsWith('zh')?'zh':'en');

function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T[lang][el.dataset.i]);
  document.querySelectorAll('[data-h]').forEach(el=>el.innerHTML=T[lang][el.dataset.h]);
  document.querySelectorAll('.pl').forEach(el=>el.textContent=T[lang].ph);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.title=T[lang].name;
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}render();});

/* deck */
const deck=document.getElementById('deck');const tints=['#E8E8ED','#E3E8EF','#ECE8E1','#E4EAE5'];let order=[0,1,2,3];
tints.forEach((c,k)=>{const el=document.createElement('div');el.className='dcard';el.style.background=c;el.innerHTML=`<div class="ph"><i class="fa-solid fa-camera"></i><span class="pl"></span><span>${k+1} / 4</span></div>`;deck.appendChild(el);});
function layoutDeck(){const cs=[...deck.children];order.forEach((k,p)=>{const r=[-3,4,-7,6][p],x=[0,10,-12,14][p],y=p*6;
  Object.assign(cs[k].style,{zIndex:10-p,opacity:p>2?0:1,transform:`translate(${x}px,${y}px) rotate(${r}deg) scale(${1-p*.035})`});});}
deck.onclick=e=>{const top=deck.children[order[0]];top.style.transform='translate(-120%,-6%) rotate(-24deg)';hearts(e,deck);setTimeout(()=>{order.push(order.shift());layoutDeck();},260);};
layoutDeck();

/* slideshows */
document.querySelectorAll('.show').forEach(s=>{const n=+s.dataset.n;
  s.innerHTML='<div class="track">'+Array.from({length:n},(_,i)=>`<div class="slide"><div class="ph"><i class="fa-solid fa-camera"></i><span class="pl"></span><span>${i+1} / ${n}</span></div></div>`).join('')+'</div>'+
  '<button class="arrow prev" aria-label="Previous"><i class="fa-solid fa-chevron-left"></i></button><button class="arrow next" aria-label="Next"><i class="fa-solid fa-chevron-right"></i></button>'+
  '<div class="dots">'+Array.from({length:n},(_,i)=>`<button class="${i?'':'on'}" aria-label="Photo ${i+1}"></button>`).join('')+'</div>';
  const tr=s.querySelector('.track'),dots=[...s.querySelectorAll('.dots button')];
  const idx=()=>Math.round(tr.scrollLeft/tr.clientWidth);
  const go=i=>tr.scrollTo({left:Math.max(0,Math.min(n-1,i))*tr.clientWidth,behavior:'smooth'});
  tr.addEventListener('scroll',()=>dots.forEach((d,j)=>d.classList.toggle('on',j===idx())));
  dots.forEach((d,j)=>d.onclick=()=>go(j));
  s.querySelector('.prev').onclick=()=>go(idx()-1);s.querySelector('.next').onclick=()=>go(idx()+1);
  tr.querySelectorAll('.slide').forEach(sl=>sl.onclick=e=>hearts(e,sl));
});

/* actions */

  toast.classList.add('show');clearTimeout(th);th=setTimeout(()=>toast.classList.remove('show'),2400);
  /* real site: location.href='mailto:…?subject=…' */
});

function hearts(e,el){const r=el.getBoundingClientRect();const c=['#1F6FEB','#FFC93C','#1F6FEB','#E8735A','#1D1D1F','#FFC93C'];
  for(let i=0;i<6;i++){const h=document.createElement('i');h.className='heart fa-solid '+(i%3===2?'fa-star':'fa-heart');h.style.color=c[i];
    h.style.left=(e.clientX-r.left-10+(Math.random()*40-20))+'px';h.style.top=(e.clientY-r.top-10)+'px';
    h.style.setProperty('--dx',(Math.random()*90-45)+'px');h.style.animationDelay=(i*55)+'ms';el.appendChild(h);setTimeout(()=>h.remove(),1600);}}

/* reveal on scroll */
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}}),{threshold:.12,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(el.parentElement.classList.contains('tiles')||el.parentElement.classList.contains('core-list')||el.parentElement.classList.contains('feat-grid')?([...el.parentElement.children].indexOf(el)*70):0)+'ms';io.observe(el);});
